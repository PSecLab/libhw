[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "libhw"
version = "0.1.0"
description = "Python bindings for libhw, a C library for driving hardware debug probes"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Embedded Systems",
]

# No third-party dependencies: the bindings are ctypes over out/libhw.so.

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["libhw*"]
