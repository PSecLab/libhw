[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "libhw"
version = "0.1.0"
description = "Python bindings for libhw, a C library for driving hardware debug probes"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Embedded Systems",
]

# No third-party dependencies: the bindings are ctypes over out/libhw.so.

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
# A small entry point so an installed package is useful from anywhere.
libhw-probe = "libhw.cli:main"

[project.urls]
Source = "https://github.com/PSecLab/libhw"

[tool.setuptools.packages.find]
where = ["."]
include = ["libhw*"]

[tool.setuptools.package-data]
# The shared library is copied in by setup.py's build_py before the package is
# collected, so the wheel is self-contained. py.typed marks the inline hints
# as usable by type checkers (PEP 561).
libhw = ["_lib/*.so", "py.typed"]
