schema_version: 1
registers:
  MMFSR:
    class: alias
    alias_of: CFSR
    bit_offset: 0
    bit_width: 8
    reason: MemManage Fault Status is CFSR[7:0]; not independent storage
    declare: true
    address: '0xE000ED28'
    provenance_table: Table D8-2 Memory-mapped System register index
    provenance_section: B3.2 System Control Space (SCS)
  BFSR:
    class: alias
    alias_of: CFSR
    bit_offset: 8
    bit_width: 8
    reason: BusFault Status is CFSR[15:8]; not independent storage
    declare: true
    address: '0xE000ED29'
    provenance_table: Table D8-2 Memory-mapped System register index
    provenance_section: B3.2 System Control Space (SCS)
  UFSR:
    class: alias
    alias_of: CFSR
    bit_offset: 16
    bit_width: 16
    reason: UsageFault Status is CFSR[31:16]; not independent storage
    declare: true
    address: '0xE000ED2A'
    provenance_table: Table D8-2 Memory-mapped System register index
    provenance_section: B3.2 System Control Space (SCS)
  DWT_COMPn:
    class: conditional_state
    requires: IMPDEF:DWT_CTRL.NUMCOMP
    reason: Comparator register array; the number implemented is IMPLEMENTATION DEFINED and is read at
      runtime from DWT_CTRL.NUMCOMP, so the architecture cannot fix a count
  DWT_MASKn:
    class: conditional_state
    requires: IMPDEF:DWT_CTRL.NUMCOMP
    reason: Comparator register array; the number implemented is IMPLEMENTATION DEFINED and is read at
      runtime from DWT_CTRL.NUMCOMP, so the architecture cannot fix a count
  DWT_FUNCTIONn:
    class: conditional_state
    requires: IMPDEF:DWT_CTRL.NUMCOMP
    reason: Comparator register array; the number implemented is IMPLEMENTATION DEFINED and is read at
      runtime from DWT_CTRL.NUMCOMP, so the architecture cannot fix a count
  SP:
    class: alias
    alias_of: SP_main
    bit_offset: 0
    bit_width: 32
    declare: true
    address: null
    provenance_section: B1.4.1 The Arm core registers
    provenance_table: 'Prose: ''SP (R13)'' - the current stack pointer'
    reason: SP names whichever of SP_main or SP_process CONTROL.SPSEL currently selects; a view of one
      of them, not independent storage. DCRSR REGSEL 13 reaches it.
register_files:
  fp_single:
    count: 32
    name_format: S%d
    width: 32
    class: conditional_state
    requires: FP_EXTENSION
    access: core_reg
    dcrsr_regsel_base: 64
    provenance_section: A2.5.2 The FP extension registers
    provenance_table: 'Prose: ''Thirty-two 32-bit single-precision registers, S0-S31'''
    extraction: manual
    reason: The FP extension register file is defined in prose rather than in a register summary table,
      so it is declared here. S0-S31 are the independent storage.
  fp_double:
    count: 16
    name_format: D%d
    width: 64
    class: alias
    requires: FP_EXTENSION
    access: core_reg
    alias_format: S%d
    alias_index_stride: 2
    provenance_section: A2.5.2 The FP extension registers
    provenance_table: 'Prose: ''Sixteen 64-bit double-precision registers, D0-D15'''
    extraction: manual
    reason: Dn is a 64-bit view of the pair S(2n):S(2n+1); the same storage as the single-precision file,
      not additional state.
