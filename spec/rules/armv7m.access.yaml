schema_version: 1
architecture: ARMv7-M
mechanism: dcrsr_dcrdr
description: 'Debug access path for core, special-purpose and FP registers. A write to DCRSR (0xE000EDF4)
  selects a register and the value appears in DCRDR (0xE000EDF8). This is a different encoding from the
  MRS/MSR SYSm values in Table B5-1: the same state element is reached differently by an instruction and
  by a debugger.'
dcrsr_address: '0xE000EDF4'
dcrdr_address: '0xE000EDF8'
dhcsr_address: '0xE000EDF0'
provenance:
  document: DDI0403
  revision: E.e
  section: C1.6.3 Debug Core Register Selector Register, DCRSR
  field: REGSEL, bits[6:0]
  page: C1-703..C1-704
  extraction: manual
  note: Defined as a prose field description rather than a table, so this mapping is transcribed by hand.
    Every entry names the section and field it came from so a reviewer can check it against the manual.
